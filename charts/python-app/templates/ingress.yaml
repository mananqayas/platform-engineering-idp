
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: "python-app"
  labels:
    app: "python-app"

spec:

  ingressClassName: "nginx"

  {{- if .Values.ingress.tls }}
  tls:
    {{- range .Values.ingress.tls }}
    - hosts:
        {{- range .hosts }}
        - {{ . | quote }}
        {{- end }}
      secretName: {{ .secretName }}
    {{- end }}
  {{- end }}
  rules:
    {{- range .Values.ingress.hosts }}
    - host: {{ .host | quote }}
      http:
        paths:
          {{- range .paths }}
          - path: {{ .path }}
            {{- with .pathType }}
            pathType: {{ . }}
            {{- end }}
            backend:
              service:
                name: "python-app"
                port:
                  number: {{ $.Values.service.port }}
          {{- end }}
    {{- end }}

